<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQA Range Calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <!-- MAIN CALCULATOR CARD -->
    <div class="calculator-card">
        <h1>EQA range Calculation</h1>

        <p>Mean Value</p>
        <input type="number" step="0.01" id="meanBox" onkeydown="blockLetters(event)">

        <p>Your Result:</p>
        <input type="number" step="0.01" id="resultBox" onkeydown="blockLetters(event)">

        <p>Z-Score:</p>
        <input type="number" step="0.01" id="zScoreBox" onkeydown="blockLetters(event)">

        <button onclick="doMath()">Calculate Ranges</button>
    </div>

    <!-- CUSTOM POP-UP BOX (Hidden by default) -->
    <div id="customModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="modalTitle">Title</h2>
            <div id="modalMessage">Message goes here</div>
            <!-- This button closes the pop-up -->
            <button onclick="closeModal()" id="modalButton">Calculate Again</button>
        </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
