<html>
  <head>
    <!-- This links your HTML to your CSS paint! -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <!-- We wrap the whole app in this "calculator-card" box -->
    <div class="calculator-card">
        
        <h1>EQA range Calculation</h1>

        <!-- Our dedicated warning area -->
        <p id="warningArea" style="color: red; font-weight: bold; height: 20px;"></p>

        <p>Mean Value</p>
        <input type="number" step="0.01" id="meanBox" onkeydown="checkInput(event)">

        <p>Your Result:</p>
        <input type="number" step="0.01" id="resultBox" onkeydown="checkInput(event)">

        <p>Z-Score:</p>
        <input type="number" step="0.01" id="zScoreBox" onkeydown="checkInput(event)">

        <button onclick="doMath()">Calculate Ranges</button>
        <h2 id="answerArea"></h2>
        
    </div>

    <!-- The JavaScript link stays at the bottom -->
    <script src="script.js"></script>
  </body>
</html>
